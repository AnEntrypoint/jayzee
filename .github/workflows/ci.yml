name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: build/emsdk
          key: emsdk-4.0.10-62a853cd3b3134398ce85cde8bb5cbb2ef0194cb-${{ runner.os }}
      - name: Fetch emsdk at the pinned commit
        run: |
          set -euo pipefail
          if [ ! -d build/emsdk/.git ]; then git clone https://github.com/emscripten-core/emsdk.git build/emsdk; fi
          git -C build/emsdk fetch --tags origin
          git -C build/emsdk checkout --detach 62a853cd3b3134398ce85cde8bb5cbb2ef0194cb
          test "$(git -C build/emsdk rev-parse HEAD)" = 62a853cd3b3134398ce85cde8bb5cbb2ef0194cb
      - name: Install and activate emsdk 4.0.10
        run: |
          build/emsdk/emsdk install 4.0.10
          build/emsdk/emsdk activate 4.0.10
      - name: Build the engine glue the tests import
        run: |
          set -euo pipefail
          bash engine/build.sh
          ENGINE_TIER_MIB=128 bash engine/build.sh
          ENGINE_VARIANT=leak bash engine/build.sh
          ENGINE_VARIANT=timed bash engine/build.sh
          ENGINE_VARIANT=timed ENGINE_TIER_MIB=128 bash engine/build.sh
          ENGINE_TIER_MIB=256 bash engine/build.sh
          ENGINE_TIER_MIB=512 bash engine/build.sh
          ENGINE_VARIANT=threads bash engine/build.sh
          ENGINE_VARIANT=threads ENGINE_TIER_MIB=128 bash engine/build.sh
          ENGINE_VARIANT=threads ENGINE_TIER_MIB=512 bash engine/build.sh
          ENGINE_VARIANT=threads ENGINE_TIER_MIB=1024 bash engine/build.sh
      - name: Fetch JoltPhysics at the pinned commit
        run: |
          set -euo pipefail
          if [ ! -d build/jolt/.git ]; then git clone --depth 1 --branch v5.3.0 https://github.com/jrouwe/JoltPhysics.git build/jolt; fi
          test "$(git -C build/jolt rev-parse HEAD)" = 0373ec0dd762e4bc2f6acdb08371ee84fa23c6db
      - name: Build the Jolt host library the native witness links
        run: |
          set -euo pipefail
          cmake -S build/jolt/Build -B build/host-jolt -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCROSS_PLATFORM_DETERMINISTIC=ON -DENABLE_OBJECT_STREAM=OFF -DINTERPROCEDURAL_OPTIMIZATION=OFF -DENABLE_ALL_WARNINGS=OFF -DTARGET_UNIT_TESTS=OFF -DTARGET_HELLO_WORLD=OFF -DTARGET_PERFORMANCE_TEST=OFF -DTARGET_SAMPLES=OFF -DTARGET_VIEWER=OFF
          cmake --build build/host-jolt --target Jolt --parallel
      - run: npm ci
      - run: npm test
      - run: npm run bench -- 500 120
