name: engine-core
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixed-memory-module:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: build/emsdk
          key: emsdk-4.0.10-62a853cd3b3134398ce85cde8bb5cbb2ef0194cb-${{ runner.os }}
      - name: Fetch emsdk at the pinned commit
        run: |
          set -euo pipefail
          if [ ! -d build/emsdk/.git ]; then git clone https://github.com/emscripten-core/emsdk.git build/emsdk; fi
          git -C build/emsdk fetch --tags origin
          git -C build/emsdk checkout --detach 62a853cd3b3134398ce85cde8bb5cbb2ef0194cb
          test "$(git -C build/emsdk rev-parse HEAD)" = 62a853cd3b3134398ce85cde8bb5cbb2ef0194cb
      - name: Install and activate emsdk 4.0.10
        run: |
          build/emsdk/emsdk install 4.0.10
          build/emsdk/emsdk activate 4.0.10
      - name: Build the fixed-memory module
        run: bash engine/build.sh
      - name: Check the artifact hash and the memory witness
        run: node scripts/check-engine-core.mjs
      - name: Build the leak variant and check that its memory witness fails
        run: |
          set -euo pipefail
          ENGINE_VARIANT=leak bash engine/build.sh
          if node scripts/check-engine-core.mjs engine/out/engine-core-64mib-leak.mjs > leak-witness.log 2>&1; then
            echo "the leak variant passed its memory witness"
            exit 1
          fi
          grep -q 'FAIL memory.buffer.byteLength is unchanged' leak-witness.log
          cat leak-witness.log
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: engine-core-64mib
          path: engine/out/engine-core-64mib.*
