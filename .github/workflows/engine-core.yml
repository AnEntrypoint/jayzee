name: engine-core
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixed-memory-module:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: build/emsdk
          key: emsdk-4.0.10-62a853cd3b3134398ce85cde8bb5cbb2ef0194cb-${{ runner.os }}
      - name: Fetch emsdk at the pinned commit
        run: |
          set -euo pipefail
          if [ ! -d build/emsdk/.git ]; then git clone https://github.com/emscripten-core/emsdk.git build/emsdk; fi
          git -C build/emsdk fetch --tags origin
          git -C build/emsdk checkout --detach 62a853cd3b3134398ce85cde8bb5cbb2ef0194cb
          test "$(git -C build/emsdk rev-parse HEAD)" = 62a853cd3b3134398ce85cde8bb5cbb2ef0194cb
      - name: Install and activate emsdk 4.0.10
        run: |
          build/emsdk/emsdk install 4.0.10
          build/emsdk/emsdk activate 4.0.10
      - name: Build the fixed-memory module, 64 MiB tier
        run: bash engine/build.sh
      - name: Build the fixed-memory module, 128 MiB tier
        run: ENGINE_TIER_MIB=128 bash engine/build.sh
      - name: Build the leak variant, 64 MiB tier
        run: ENGINE_VARIANT=leak bash engine/build.sh
      - name: Build the fixed-memory module, 512 MiB tier
        run: ENGINE_TIER_MIB=512 bash engine/build.sh
      - name: Build the threaded module the tier gate plans on, 1024 MiB tier
        run: ENGINE_VARIANT=threads ENGINE_TIER_MIB=1024 bash engine/build.sh
      - name: Check the artifact hashes and the memory witness of both fixed tiers
        run: |
          set -euo pipefail
          node scripts/check-engine-core.mjs engine/out/engine-core-64mib.mjs
          node scripts/check-engine-core.mjs engine/out/engine-core-128mib.mjs
      - name: Check the leak variant's pinned hash and that its memory grows
        run: node scripts/check-engine-leak.mjs engine/out/engine-core-64mib-leak.mjs
      - name: Run the engine gates
        run: |
          set -euo pipefail
          for gate in artifacts world bridge pools planet vegetation codecs materials interest render isolation tiers; do
            node scripts/check-engine-$gate.mjs
          done
          node scripts/check-client-resource-pools.mjs
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: engine-core-wasm
          path: engine/out/engine-core-*.*
